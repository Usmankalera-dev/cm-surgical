# CM SURGICAL — nginx site configuration
#
# Copy to  /etc/nginx/sites-available/cm-surgical
# Then:    ln -s /etc/nginx/sites-available/cm-surgical /etc/nginx/sites-enabled/
#          rm /etc/nginx/sites-enabled/default
#          nginx -t && systemctl reload nginx
#
# Replace every  example.com  below with the real domain before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Lets Encrypt will use this. Do not add SSL lines here yet — certbot edits
    # this file for you when the certificate is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Serve images and CSS directly from nginx, not from Flask ---
    # Much faster, and it means product photos don't tie up a worker.
    location /static/ {
        alias /srv/cm-surgical/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Everything else goes to Flask ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Flask needs the real client details, otherwise the site thinks every
        # visitor is 127.0.0.1 and rate limiting / logs become useless.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Block access to anything sensitive, in case a file is ever misplaced.
    location ~ /\. {
        deny all;
        return 404;
    }
}

# After running certbot, certbot will add listen 443 + the certificate paths.
# Keep this block BELOW the one above so plain http redirects to https.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}